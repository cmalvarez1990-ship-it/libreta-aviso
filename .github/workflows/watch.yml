name: Revisar agenda libreta

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: libreta
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Restaurar estado (días ya avisados)
        uses: actions/cache@v4
        with:
          path: state.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar calendario
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python libreta_watcher.py --once
